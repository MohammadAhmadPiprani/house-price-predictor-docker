name: House Price-Prediction

on:
  push:
    branches: [ "main" ]
 
jobs:

  test-and-build:

    runs-on: ubuntu-latest

    steps:
    - name: checking
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip 
        pip install -r requirements.txt
        pip install pytest flake8
    - name: Flake8 checking of code
      run: |
        git status
        git log -1 --oneline
        sed -n '1,30p' app.py
        sed -n '1,20p' model.py
        flake8 .

    - name: Run pytest
      run: |
        PYTHONPATH=. pytest 
    - name: Build Docker Image
      run: |
        docker build -t house_price_prediction:${{ github.sha }} .
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push to Docker Hub
      run: |
        docker tag house_price_prediction:${{ github.sha }} \
          ${{ secrets.DOCKERHUB_USERNAME }}/house_price_prediction:${{ github.sha }}

        docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/house_price_prediction:${{ github.sha }}
    
    - name: login to EC2
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{secrets.PUBLIC_IP}}
        username: ubuntu
        key: ${{secrets.PRIVATE_KEY}}
        script: |
          cd /home/ubuntu/House_Price_Prediction
          export IMAGE_TAG=${{ github.sha }}
          docker compose pull
          docker compose up -d


      

       
