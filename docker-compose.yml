version: '3.8'
services:
  server:
      build: ./nginx
      container_name: nginx_container
      ports:
      - "8080:80"
      environment:
      - server-env=production
      depends_on:
        - web-app
  web-app:
    build: .
    image: flask_app:latest 
    container_name: flask_app
    ports:
    - "5000:5000"
    environment:
    - app-env=production




